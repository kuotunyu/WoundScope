[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "woundscope"
version = "0.2.1"
description = "Reproducible foot-ulcer image segmentation research and deployment pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "kuotunyu" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "safetensors>=0.4,<1",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/kuotunyu/WoundScope"
Repository = "https://github.com/kuotunyu/WoundScope"
Issues = "https://github.com/kuotunyu/WoundScope/issues"

[project.optional-dependencies]
train = [
  "albumentations>=1.4,<3",
  "matplotlib>=3.8,<4",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "segmentation-models-pytorch>=0.3.3,<1",
  "tensorboard>=2.15,<3",
  "torch>=2,<3",
  "torchvision>=0.17,<1",
  "transformers>=4.45,<6",
]
export = [
  "onnx>=1.16,<2",
  "onnxruntime>=1.18,<2",
  "torch>=2,<3",
]
app = [
  "fastapi>=0.116,<1",
  "gradio>=5,<7",
  "huggingface-hub>=0.25,<2",
  "opencv-python-headless>=4.9,<5",
  "python-multipart>=0.0.20,<1",
  "torch>=2,<3",
  "uvicorn[standard]>=0.35,<1",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
woundscope = "woundscope.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/woundscope"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires downloaded FUSeg data or optional runtime dependencies",
  "slow: long-running test excluded from the default CI gate",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
