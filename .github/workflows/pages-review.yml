name: Pages review

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  review:
    name: Build, audit and browser-review the Pages artifact (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # check:toolchain writes toolchain.json into the report directory, so both phases share it.
      WOUNDSCOPE_PAGES_PUBLISH_DIR: ${{ github.workspace }}/temp/pages-review/first/publish
      WOUNDSCOPE_PAGES_REPORT_DIR: ${{ github.workspace }}/temp/pages-review/reports
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12.13"
          enable-cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
          package-manager-cache: false
      - name: Derive SOURCE_DATE_EPOCH from the checked-out commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Python gates (lint, tests, privacy audit)
        run: |
          uv sync --frozen --extra dev --python 3.12.13
          uv run ruff check scripts/pages_site scripts/build_pages_site.py scripts/audit_pages_site.py tests/pages
          uv run ruff format --check scripts/pages_site scripts/build_pages_site.py scripts/audit_pages_site.py tests/pages
          uv run pytest -q tests/pages
          uv run python scripts/audit_repository_privacy.py --repository .
      - name: Build twice from the exact commit and compare byte determinism
        run: |
          uv run python scripts/build_pages_site.py --repository . --output temp/pages-review/first/publish --site-source "$GITHUB_SHA"
          uv run python scripts/build_pages_site.py --repository . --output temp/pages-review/second/publish --site-source "$GITHUB_SHA"
          uv run python scripts/audit_pages_site.py compare --left temp/pages-review/first/publish --right temp/pages-review/second/publish
      - name: Controlled acquisition of the pinned reviewer toolchain
        run: |
          uv run python scripts/verify_pages_review_package.py --package site-review/package.json --lockfile site-review/pnpm-lock.yaml
          corepack enable && corepack prepare pnpm@11.16.0 --activate
          pnpm -C site-review install --frozen-lockfile --ignore-scripts
          # pnpm 11 skips bin-linking under --ignore-scripts, so call the Playwright CLI file directly.
          pnpm -C site-review exec -- node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
          pnpm -C site-review check:toolchain
      - name: Browser execution phase (loopback-only server) and unsealed review bundle
        # The review is deliberately left unsealed here: sealing requires the manual 200% browser-zoom
        # receipt for all three exact engines, which only the central operator can produce. CI
        # exports the verified publish tree and the automated reports for that operator.
        run: |
          mkdir -p "$WOUNDSCOPE_PAGES_REPORT_DIR"
          pnpm -C site-review exec -- node node_modules/@playwright/test/cli.js test
          mkdir -p temp/pages-review/bundle
          uv run python scripts/audit_pages_site.py verify --publish temp/pages-review/first/publish > temp/pages-review/bundle/verify.json
          cp -r temp/pages-review/first/publish temp/pages-review/bundle/publish
          cp -r temp/pages-review/reports temp/pages-review/bundle/reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: woundscope-pages-review-${{ github.sha }}
          path: temp/pages-review/bundle
          # The publish tree carries .nojekyll, which upload-artifact v4 drops by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
