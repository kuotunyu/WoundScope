name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-311-tests:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Audit tracked repository privacy
        run: python scripts/audit_repository_privacy.py --repository .
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  python-312-build:
    name: Python 3.12 + package build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -q
      - run: uv build --out-dir dist
      - name: Smoke install built wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --isolated --no-project --with "$wheel" python -c \
            "import woundscope; print('PACKAGE_INSTALL_SMOKE_PASS', woundscope.__version__)"

  frontend-tests:
    name: React frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.16.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  synthetic-gates:
    name: synthetic-gates
    if: ${{ always() }}
    needs:
      - python-311-tests
      - python-312-build
      - frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every supported gate
        env:
          PYTHON_311_RESULT: ${{ needs['python-311-tests'].result }}
          PYTHON_312_RESULT: ${{ needs['python-312-build'].result }}
          FRONTEND_RESULT: ${{ needs['frontend-tests'].result }}
        shell: bash
        run: |
          test "$PYTHON_311_RESULT" = "success"
          test "$PYTHON_312_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
