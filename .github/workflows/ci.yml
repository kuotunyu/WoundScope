name: CI

on:
  push:
  pull_request:

jobs:
  synthetic-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Audit prohibited tracked artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^data/(raw|manifests)/|\.safetensors$|\.onnx$|\.pt$|^\.env$|^reports/(generated|error_gallery|sample_predictions)/)'; then
            echo "Prohibited data, secret, or model artifact is tracked"
            exit 1
          fi
